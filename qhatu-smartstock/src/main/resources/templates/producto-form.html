<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Producto')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{layout :: sidebar}"></aside>

    <main class="main">
        <div class="topbar">
            <div>
                <h1 th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">Producto</h1>
                <p class="subtitle">Completa los datos del producto</p>
            </div>
            <a th:href="@{/productos}" class="btn btn-secondary">← Volver</a>
        </div>

        <div class="panel" style="max-width: 720px;">
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="form-group">
                    <label>Nombre del producto</label>
                    <input type="text" th:field="*{nombre}" required placeholder="Ej. Arroz 1kg"/>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Categoría</label>
                        <input type="text" th:field="*{categoria}" required placeholder="Ej. Abarrotes"/>
                    </div>
                    <div class="form-group">
                        <label>Precio (S/)</label>
                        <input type="number" step="0.01" min="0" th:field="*{precio}" required placeholder="0.00"/>
                    </div>
                    <div class="form-group">
                        <label>Stock actual</label>
                        <input type="number" min="0" th:field="*{stock}" required placeholder="0"/>
                    </div>
                    <div class="form-group">
                        <label>Stock mínimo (alerta)</label>
                        <input type="number" min="0" th:field="*{stockMinimo}" required placeholder="0"/>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Guardar</button>
                    <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
